<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Mismo degradado del logo NVISION de la pagina (tema claro):
         linear-gradient(135deg, #0f172a 30%, #0284c7 100%) -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.3" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="98" height="98" rx="22" fill="#ffffff"/>
  <rect x="1" y="1" width="98" height="98" rx="22" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="53" y="52" text-anchor="middle" dominant-baseline="central"
        font-family="'JetBrains Mono', monospace" font-weight="800"
        font-size="48" letter-spacing="5.76" fill="url(#g)">NV</text>
